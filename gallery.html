<!DOCTYPE html>
<!-- ===== GALLERY PAGE =====
     Filters, picture tiles, and the lightbox are built by js/gallery.js.
     To add pictures or categories, edit that file. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery | Andrei Custodio</title>
  <meta name="description" content="Photography and digital art by Andrei Custodio: cityscapes, architecture, landscapes, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Rajdhani:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <a class="skip-link" href="#main">Skip to content</a>

  <!-- HEADER (same on every page) -->
  <header class="site-header">
    <div class="container header-inner">
      <a href="index.html" class="brand" aria-label="Andrei Custodio, home">
        <span class="brand-mark" aria-hidden="true">AC</span>
        <span class="brand-name">Andrei Custodio</span>
      </a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle menu">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <ul class="nav-list">
          <li><a class="nav-link" href="index.html">Home</a></li>
          <li><a class="nav-link" href="about.html">About</a></li>
          <li><a class="nav-link" href="gallery.html">Gallery</a></li>
          <li><a class="nav-link" href="skills.html">Skills</a></li>
          <li><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main">

    <section class="page-header">
      <div class="container">
        <h1>Gallery</h1>
        <!-- EDIT ME: a line about your photos and art -->
        <p>Sort the photos by category. Click a button to show only that set.</p>
      </div>
    </section>

    <section class="section section-tight">
      <div class="container">

        <!-- Filter buttons are created by js/gallery.js -->
        <div class="filter-bar" id="filter-bar" aria-label="Filter pictures by category"></div>

        <!-- Picture tiles are created by js/gallery.js -->
        <div class="gallery-grid" id="gallery-grid"></div>

        <!-- Full-screen viewer. It stays hidden until a picture is clicked. -->
        <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Image viewer" hidden>
          <div class="lightbox-inner">
            <button class="lightbox-close" id="lightbox-close" type="button">Close</button>
            <img id="lightbox-img" src="placeholder.svg" alt="">
            <p class="lightbox-caption" id="lightbox-caption"></p>
          </div>
        </div>

      </div>
    </section>

  </main>

  <!-- FOOTER (same on every page) -->
  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; <span id="year">2026</span> Andrei Custodio. Built with HTML, CSS, and JavaScript.</p>
      <p><a href="contact.html">Get in touch</a></p>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="main.js"></script>
  <script src="gallery.js"></script>
</body>
</html>
